services:
  # La Base de Datos
  db:
    image: mysql:8.0
    container_name: carzone-db
    # Siempre reiniciamos el contenedor de la base de datos para evitar problemas de conexión al iniciar los otros servicios
    restart: always
    environment:
      MYSQL_DATABASE: carzone
      MYSQL_ROOT_PASSWORD: toor
    # para que los logs no se coman el espacio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  # El Backend
  api:
    build: ./carzone-api
    container_name: carzone-api
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_DATABASE: carzone
      DB_USERNAME: root
      DB_PASSWORD: toor
    volumes:
      - ./carzone-api/storage/app/public:/var/www/html/storage/app/public

  # El Frontend
  front:
    build: ./carzone-front
    container_name: carzone-front
    depends_on:
      - api
    
  proxy:
    image: nginx:alpine
    container_name: carzone-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./entrypoint-nginx.sh:/entrypoint-nginx.sh:ro
    # esto es para que el contenedor de nginx ejecute el script de generación 
    # de certificados antes de arrancar, y así no tener que preocuparnos por eso
    entrypoint: >
      /bin/sh -c "apk add --no-cache openssl && sh /entrypoint-nginx.sh"
    depends_on:
      - api
      - front

volumes:
  db_data: