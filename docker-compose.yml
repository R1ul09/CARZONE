services:

  # base de datos
  db:
    image: mysql:8.0
    container_name: carzone-db
    restart: always
    environment:
      MYSQL_DATABASE: carzone
      MYSQL_ROOT_PASSWORD: toor
    healthcheck:
      # Docker esperará a que MySQL acepte conexiones antes de arrancar la API.
      # Esto evita errores de "conexión rechazada" al iniciar.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptoor"]
      interval: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        # Limitamos el tamaño de los logs para no llenar el disco
        max-size: "10m"
        max-file: "3"

  # backend
  api:
    build: ./carzone-api
    container_name: carzone-api
    # Esperamos a que MySQL esté REALMENTE listo (no solo arrancado)
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./carzone-api/.env
    volumes:
      - ./carzone-api/storage/app/public:/var/www/html/storage/app/public
      - ./entrypoint-api.sh:/entrypoint-api.sh:ro
    # Este script prepara Laravel (migrations, seeders) antes de arrancar
    entrypoint: ["/bin/sh", "/entrypoint-api.sh"]

  # fontend
  front:
    build: ./carzone-front
    container_name: carzone-front
    depends_on:
      - api

  # proxy inverso (Nginx)
  proxy:
    image: nginx:alpine
    container_name: carzone-proxy
    ports:
      # http, redirige automáticamente a https
      - "80:80"
      # htpps, entrada principal
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./entrypoint-nginx.sh:/entrypoint-nginx.sh:ro
    # Genera los certificados ssl autofirmados si no existen, luego arranca Nginx
    entrypoint: >
      /bin/sh -c "apk add --no-cache openssl && sh /entrypoint-nginx.sh"
    depends_on:
      - api
      - front

# volumenes
volumes:
  # lo dejamos vacio porque MySQL lo llenará automáticamente con los datos de la base de datos
  db_data: