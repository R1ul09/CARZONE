services:

  # ─── BASE DE DATOS ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: carzone-db
    restart: always
    environment:
      MYSQL_DATABASE: carzone
      MYSQL_ROOT_PASSWORD: toor
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptoor"]
      interval: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── BACKEND (Laravel + Apache) ─────────────────────────────────────────────
  api:
    build: ./carzone-api
    container_name: carzone-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./carzone-api/.env
    volumes:
      - ./carzone-api/storage/app/public:/var/www/html/storage/app/public
      - ./entrypoint-api.sh:/entrypoint-api.sh:ro
    # Convertimos saltos de línea y ejecutamos el script
    # Esto garantiza que funcione aunque el archivo venga de Windows
    entrypoint: ["/bin/sh", "-c", "sed -i 's/\\r//' /entrypoint-api.sh && sh /entrypoint-api.sh"]

  # ─── FRONTEND (Angular compilado + Nginx) ───────────────────────────────────
  front:
    build: ./carzone-front
    container_name: carzone-front
    depends_on:
      - api

  # ─── PROXY INVERSO (Nginx con HTTPS) ────────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: carzone-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./entrypoint-nginx.sh:/entrypoint-nginx.sh:ro
    # Convertimos saltos de línea antes de ejecutar el script de certificados
    entrypoint: >
      /bin/sh -c "apk add --no-cache openssl && sed -i 's/\r//' /entrypoint-nginx.sh && sh /entrypoint-nginx.sh"
    depends_on:
      - api
      - front

# ─── VOLÚMENES ────────────────────────────────────────────────────────────────
volumes:
  db_data: