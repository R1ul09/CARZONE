# Redirigir de HTTP a HTTPS
server {
    listen 80;
    server_name localhost;
    # redirigimos todo el tráfico HTTP a HTTPS para asegurar que las comunicaciones sean seguras
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Rutas de los certificados
    ssl_certificate /etc/nginx/certs/carzone.crt;
    ssl_certificate_key /etc/nginx/certs/carzone.key;

    # estamos usando TLS 1.2 y 1.3, que son las versiones más seguras actualmente, 
    # y deshabilitamos los cifrados débiles
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Medidas de seguridad básicas para proteger contra ataques comunes
    # esta primera línea oculta la versión de Nginx para evitar dar información a posibles atacantes
    add_header X-Frame-Options "SAMEORIGIN";

    # y esta segunda línea activa la protección contra ataques XSS en los navegadores modernos
    add_header X-XSS-Protection "1; mode=block";

    # Frontend
    location / {
        proxy_pass http://carzone-front:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # esta línea es importante para que Angular maneje correctamente las rutas en el frontend,
        # ya que Angular usa rutas del lado del cliente y Nginx necesita saber que debe servir el 
        # index.html para cualquier ruta que no corresponda a un archivo real
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # Storage (para servir los archivos de almacenamiento de Laravel)
    location /storage {
        proxy_pass http://carzone-api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend
    location /api {
        proxy_pass http://carzone-api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}