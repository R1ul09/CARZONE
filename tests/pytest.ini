[pytest]
# Nombre del proyecto en los informes
testpaths = .

# Muestra más detalle en los errores
addopts =
    -v
    --tb=short
    --html=informe.html
    --self-contained-html

# Silencia el warning de SSL (certificado autofirmado en local)
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning