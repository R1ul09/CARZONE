<section class="login-page">
  <div class="login-card" data-aos="fade-in" data-aos-duration="1000">

    <h1 class="heading">Crear cuenta</h1>
    <p class="subheading">Únete a Carzone hoy mismo</p>

    <div class="field">
      <label>Nombre completo</label>
      <div class="input-wrap">
        <span class="icon">👤︎</span>
        <input type="text" placeholder="Tu nombre completo">
      </div>
    </div>

    <div class="field">
      <label>Correo electrónico</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input type="email" placeholder="tu@email.com">
      </div>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <div class="input-wrap">
        <span class="icon">&#x1f512;&#xfe0e;</span>
        <input type="password" placeholder="••••••••">
      </div>
    </div>

    <div class="field">
      <label>Confirmar contraseña</label>
      <div class="input-wrap">
        <span class="icon">&#x1f512;&#xfe0e;</span>
        <input type="password" placeholder="••••••••">
      </div>
    </div>

    <button class="btn-primary">Crear cuenta</button>

    <p class="register">
      ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
    </p>

  </div>
</section>
