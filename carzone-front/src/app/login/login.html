<section class="login-page">
  <div class="login-card" data-aos="fade-in" data-aos-duration="1000">

    <h1 class="heading">Bienvenido</h1>
    <p class="subheading">Inicia sesión en tu cuenta</p>

    <div class="field">
      <label>Correo electrónico</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input type="email" placeholder="tu@email.com">
      </div>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <div class="input-wrap">
        <span class="icon">&#x1f512;&#xfe0e;
        </span>
        <input type="password" placeholder="••••••••">
      </div>
    </div>

    <div class="row">
      <label class="check-wrap">
        <input type="checkbox"> Recuérdame
      </label>
      <a routerLink="/forgot-password" class="forgot">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="btn-primary">Iniciar sesión</button>

    <p class="register">
      ¿Nuevo en Carzone? <a routerLink="/register">Crear cuenta</a>
    </p>

  </div>
</section>
