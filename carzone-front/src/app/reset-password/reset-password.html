<section class="auth-page">
    <div class="auth-card">

        @if (exito) {
        <div class="success-notice">
            <h2>¡Contraseña actualizada!</h2>
            <p>Tu contraseña ha sido cambiada correctamente.<br>Redirigiendo al inicio de sesión...</p>
        </div>
        }

        @if (!exito) {
        <h1 class="heading">Nueva contraseña</h1>
        <p class="subheading">Introduce tu nueva contraseña para la cuenta <strong>{{ email }}</strong>.</p>

        <div class="field">
            <label for="reset-password">Nueva contraseña</label>
            <div class="input-wrap">
            <span class="icon">🔒︎</span>
            <input id="reset-password" type="password" placeholder="••••••••" [(ngModel)]="password">
            </div>
        </div>

        <div class="field">
            <label for="reset-confirm">Confirmar contraseña</label>
            <div class="input-wrap">
            <span class="icon">🔒︎</span>
            <input id="reset-confirm" type="password" placeholder="••••••••" [(ngModel)]="confirm"
                    (keyup.enter)="resetear()">
            </div>
        </div>

        <button class="btn-primary" (click)="resetear()" [disabled]="cargando">
            @if (cargando) { Actualizando... } @else { Cambiar contraseña }
        </button>

        <a routerLink="/forgot-password" class="link-back">← Solicitar nuevo enlace</a>
        }

    </div>
</section>
