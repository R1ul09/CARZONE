<div class="cliente-dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <div class="sidebar-user-info">
        <p class="sidebar-titulo">MI CUENTA</p>
        <p class="sidebar-nombre">{{ user?.name }}</p>
        <p class="sidebar-email">{{ user?.email }}</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" [class.active]="seccionActiva === 'resumen'"
              (click)="setSeccion('resumen')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Resumen</span>
      </button>

      <button class="nav-item" [class.active]="seccionActiva === 'citas'"
              (click)="setSeccion('citas')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span>Mis Citas</span>
        @if (citas.length > 0) {
          <span class="nav-badge">{{ citas.length }}</span>
        }
      </button>

      <button class="nav-item" [class.active]="seccionActiva === 'financiaciones'"
              (click)="setSeccion('financiaciones')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M2 10h20"/>
        </svg>
        <span>Financiaciones</span>
        @if (financiaciones.length > 0) {
          <span class="nav-badge">{{ financiaciones.length }}</span>
        }
      </button>

      <button class="nav-item" [class.active]="seccionActiva === 'perfil'"
              (click)="setSeccion('perfil')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span>Mi Perfil</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="dashboard-main">
    @if (!datosListos) {
      <div class="loading">
        <p>Cargando...</p>
      </div>
    } @else {
        @if (seccionActiva === 'resumen') {
          <app-resumen [citas]="citas" [financiaciones]="financiaciones"/>
        }
        @if (seccionActiva === 'citas') {
          <app-citas [citas]="citas" [servicios]="servicios" [coches]="cochesDisponibles"
                    (citaCreada)="cargarDatos()" (citaCancelada)="cargarDatos()"/>
        }
        @if (seccionActiva === 'financiaciones') {
          <app-financiaciones [financiaciones]="financiaciones" (financiacionEliminada)="cargarDatos()"/>
        }
        @if (seccionActiva === 'perfil') {
          <app-perfil [user]="user"/>
        }
    }
  </main>

</div>
