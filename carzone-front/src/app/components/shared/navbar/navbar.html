<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <button class="logo-btn" routerLink="/">
      <img src="assets/logos/logo-carzone-no-bg.svg" alt="Carzone Logo" />
    </button>

    <div class="nav-links">
      <a routerLink="/">INICIO</a>
      <div class="dropdown" [class.active]="isDropdownOpen">
        <button class="dropdown-toggle" (click)="toggleDropdown()">
          MARCAS
          <span class="dropdown-arrow" [class.rotated]="isDropdownOpen">▼</span>
        </button>
        <div class="dropdown-menu">
            @for (marca of marcas; track marca.id) {
              <a [routerLink]="['/marcas', marca.id]" class="marca-item">
                <img [src]="marca.logo" [alt]="marca.nombre" data-aos="fade-up" [attr.data-aos-delay]="marca.id * 50" class="marca-logo">
                <span data-aos="fade-up" [attr.data-aos-delay]="marca.id * 50">{{ marca.nombre }}</span>
              </a>
            }
          </div>
      </div>
      <a routerLink="/financiacion">FINANCIACIÓN</a>
      <a routerLink="/comparar">COMPARAR</a>
    </div>

    <div class="auth-buttons">
      @if (!isLoggedIn) {
          <button class="login-btn" (click)="irAlLogin()">
              INICIAR SESIÓN
          </button>
      }

      @if (isLoggedIn) {
          <div class="user-menu" [class.active]="isUserMenuOpen">
              <button class="user-btn" (click)="toggleUserMenu()">
                  <span class="user-icon">👤</span>
                  <span class="user-name">{{ user?.name }}</span>
                  <span class="dropdown-arrow" [class.rotated]="isUserMenuOpen">▼</span>
              </button>
              <div class="user-dropdown">
                  <a [routerLink]="getDashboardRoute()">Dashboard</a>
                  <div class="dropdown-divider"></div>
                  <button (click)="logout()">Cerrar sesión</button>
              </div>
          </div>
        }
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
    </button>
  </div>

  <div class="mobile-overlay" [class.active]="isMenuOpen">
    <div class="mobile-menu-content">
      <a routerLink="/" (click)="toggleMenu()">INICIO</a>
      
      <div class="mobile-marcas-accordion" [class.open]="isMobileMarcasOpen">
        <button class="mobile-marcas-toggle" (click)="toggleMobileMarcas()">
          MARCAS
          <span class="mobile-dropdown-arrow" [class.rotated]="isMobileMarcasOpen">▼</span>
        </button>
        <div class="mobile-marcas-list">
          @for (marca of marcas; track marca.id) {
            <a [routerLink]="['/marcas', marca.id]" (click)="toggleMenu()">
              {{ marca.nombre }}
            </a>
          }
        </div>
      </div>

      <a routerLink="/financiacion" (click)="toggleMenu()">FINANCIACIÓN</a>
      <a routerLink="/comparar" (click)="toggleMenu()">COMPARAR</a>
      @if (!isLoggedIn) {
        <a routerLink="/login" class="login-btn-mobile" (click)="toggleMenu()">INICIAR SESIÓN</a>
      } @else {
        <a [routerLink]="getDashboardRoute()" (click)="toggleMenu()">Dashboard</a>
        <button class="login-btn-mobile" (click)="logout(); toggleMenu()">Cerrar sesión</button>
      }
    </div>
  </div>
</nav>
